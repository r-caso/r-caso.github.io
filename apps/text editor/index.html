<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Text Editor</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bar">
  <input id="name" aria-label="File name" value="untitled" spellcheck="false">
  <div class="seg" role="group" aria-label="Format">
    <button id="m-txt" aria-pressed="false">Plain text</button>
    <button id="m-md" aria-pressed="true">Markdown</button>
  </div>
  <span class="sep"></span>
  <button id="new">New</button>
  <button id="open">Open</button>
  <button id="save" class="primary">Save</button>
  <span class="spacer"></span>
  <button id="wrap" aria-pressed="true" title="Wrap long lines">Wrap</button>
  <button id="prev" aria-pressed="true" title="Show preview">Preview</button>
  <button id="theme" title="Toggle light/dark">Theme</button>
  <input id="file" type="file" accept=".txt,.md,.markdown,text/*" class="hidden">
</div>
<div class="bar" id="tools" aria-label="Formatting">
  <button data-a="bold" title="Bold (Ctrl+B)"><b>B</b></button>
  <button data-a="italic" title="Italic (Ctrl+I)"><i>I</i></button>
  <button data-a="code" title="Inline code">&lt;/&gt;</button>
  <button data-a="link" title="Link (Ctrl+K)">Link</button>
  <span class="sep"></span>
  <button data-a="h" title="Heading">H</button>
  <button data-a="ul" title="Bulleted list">• List</button>
  <button data-a="ol" title="Numbered list">1. List</button>
  <button data-a="quote" title="Quote">“ ”</button>
</div>
<main id="main" class="split">
  <textarea id="ed" aria-label="Editor" spellcheck="true" placeholder="Start typing…"></textarea>
  <div id="pv" aria-label="Preview"></div>
</main>
<div class="status"><span id="s-count"></span><span id="s-pos"></span><span class="spacer"></span><span id="s-save"></span></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
